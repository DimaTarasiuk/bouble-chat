name: Build APK and Desktop

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Remove any pre-existing platform folders
        run: rm -rf android build

      - name: Generate Android platform files
        run: flutter create --project-name login_app --org com.example --platforms=android .

      - name: Add Internet permission
        run: |
          sed -i '/<manifest/a\    <uses-permission android:name="android.permission.INTERNET"/>' android/app/src/main/AndroidManifest.xml

      - name: Check Android Manifest
        run: |
          echo "===== AndroidManifest.xml ====="
          cat android/app/src/main/AndroidManifest.xml
          echo "===== INTERNET permission ====="
          if grep -q 'android.permission.INTERNET' android/app/src/main/AndroidManifest.xml; then
            echo "INTERNET permission FOUND"
          else
            echo "INTERNET permission NOT FOUND"
            exit 1
          fi

      - name: Allow cleartext HTTP traffic
        run: |
          sed -i 's/<application/<application android:usesCleartextTraffic="true"/' android/app/src/main/AndroidManifest.xml

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Enable Windows desktop support
        run: flutter config --enable-windows-desktop

      - name: Remove any pre-existing platform folders
        run: |
          Remove-Item -Recurse -Force windows -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force build -ErrorAction SilentlyContinue

      - name: Generate platform files
        run: flutter create --project-name login_app --org com.example --platforms=windows .

      - name: Install dependencies
        run: flutter pub get

      - name: Show Flutter/Visual Studio diagnostics
        run: flutter doctor -v

      - name: Build Windows exe
        run: flutter build windows --release

      - name: Zip the build
        run: |
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath login_app-windows.zip

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: app-release-windows
          path: login_app-windows.zip

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Enable macOS desktop support
        run: flutter config --enable-macos-desktop

      - name: Remove any pre-existing platform folders
        run: rm -rf macos build

      - name: Generate platform files
        run: flutter create --project-name login_app --org com.example --platforms=macos .

      - name: Allow cleartext HTTP traffic
        run: |
          plutil -replace NSAppTransportSecurity -xml '<dict><key>NSAllowsArbitraryLoads</key><true/></dict>' macos/Runner/Info.plist

      - name: Install dependencies
        run: flutter pub get

      - name: Build macOS app
        run: flutter build macos --release

      - name: Ad-hoc code sign
        run: |
          APP_PATH=$(find build/macos/Build/Products/Release -maxdepth 1 -name "*.app")
          echo "Signing: $APP_PATH"
          codesign --force --deep --sign - "$APP_PATH"

      - name: Package with ditto
        run: |
          cd build/macos/Build/Products/Release
          APP_NAME=$(find . -maxdepth 1 -name "*.app" -exec basename {} \;)
          ditto -c -k --keepParent "$APP_NAME" ../../../../../login_app-macos.zip

      - name: Upload macOS build
        uses: actions/upload-artifact@v4
        with:
          name: app-release-macos
          path: login_app-macos.zip

  release:
    needs: [android, windows, macos]
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten into one folder
        run: |
          mkdir -p release-files
          cp artifacts/app-release-apk/app-release.apk release-files/
          cp artifacts/app-release-windows/login_app-windows.zip release-files/
          cp artifacts/app-release-macos/login_app-macos.zip release-files/

      - name: Publish (or update) the "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          files: release-files/*